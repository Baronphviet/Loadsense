name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  core-engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: loadsense
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: loadsense_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loadsense -d loadsense_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Unit and integration tests on H2
        run: mvn -B -f core-engine/pom.xml test
      - name: Flyway and integration tests on PostgreSQL
        run: >-
          mvn -B -f core-engine/pom.xml verify
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/loadsense_test
          -Dspring.datasource.username=loadsense
          -Dspring.datasource.password=ci-test-password
          -Dspring.jpa.hibernate.ddl-auto=validate
          -Dspring.flyway.enabled=true
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend build
  ai-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r ai-service/requirements.txt
      - run: python -m unittest discover -s ai-service/tests
