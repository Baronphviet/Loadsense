services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-loadsense}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me}
      POSTGRES_DB: ${DATABASE_NAME:-loadsense}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-loadsense} -d loadsense"]
      interval: 5s
      timeout: 5s
      retries: 10
  core-engine:
    build: ../core-engine
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-loadsense}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-loadsense}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-key-loadsense-12345}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ALLOWED_TARGET_HOSTS: ${ALLOWED_TARGET_HOSTS:-localhost,127.0.0.1,core-engine}
      MAX_ACTIVE_EXECUTIONS: ${MAX_ACTIVE_EXECUTIONS:-2}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  frontend:
    build: ../frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      core-engine:
        condition: service_healthy
    restart: unless-stopped
  ai-service:
    profiles: ["ai"]
    build: ../ai-service
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_TIMEOUT_SECONDS: ${NVIDIA_TIMEOUT_SECONDS:-90}
volumes:
  postgres_data:
